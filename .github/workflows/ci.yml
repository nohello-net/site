name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FC_DEBUG: 1

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - run: yarn install
      - run: yarn test:unit

  ui-test:
    runs-on: ubuntu-latest
    # Playwright's image for the @playwright/test version in yarn.lock: it has
    # the browser, its system dependencies and the fonts, so the snapshots stay
    # the same from run to run. Change this tag when you upgrade Playwright.
    container: mcr.microsoft.com/playwright:v1.20.1-focal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - run: yarn install
      - run: fc-list
      - run: yarn ci:ui
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-test-results
          path: test-results/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - run: yarn install
      - run: yarn lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - run: yarn install
      - run: yarn typecheck
